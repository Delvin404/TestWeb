<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Libre+Franklin:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#5f32a7;--bg2:#43209b;--paper:#FFFCF3;--ink:#2B1150;--cream:#FFF7E8;--yolk:#FFD23F;--chili:#FF3B5C;--ease:cubic-bezier(.22,.9,.32,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(ellipse 900px 550px at 15% -5%,rgba(255,210,63,.2),transparent 60%),
    radial-gradient(ellipse 750px 550px at 100% 15%,rgba(0,194,168,.2),transparent 55%),
    radial-gradient(ellipse 850px 650px at 50% 105%,rgba(255,59,92,.18),transparent 60%),var(--bg);
  color:var(--cream);font-family:'Libre Franklin',sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--yolk);outline-offset:4px}

/* the one button */
#go{
  background:var(--chili);color:var(--cream);
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;
  font-size:clamp(30px,7vw,54px);letter-spacing:.01em;
  padding:.6em 1.3em;border-radius:3px;
  box-shadow:0 14px 34px -8px rgba(255,59,92,.6),6px 6px 0 rgba(0,0,0,.25);
  transform:scale(0);opacity:0;
  animation:pop .7s var(--ease) .25s forwards;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
#go:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 20px 40px -8px rgba(255,59,92,.7),8px 8px 0 rgba(0,0,0,.25)}
#go:active{transform:scale(.97)}
@keyframes pop{0%{transform:scale(0) rotate(-6deg);opacity:0}70%{transform:scale(1.08) rotate(1deg);opacity:1}100%{transform:scale(1);opacity:1}}

/* loading */
#loading{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:14px;color:rgba(255,247,232,.75)}
#loading.on{display:flex}
.spin{width:34px;height:34px;border:3px solid rgba(255,247,232,.2);border-top-color:var(--yolk);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* results overlay */
#results{position:fixed;inset:0;z-index:10;background:var(--paper);color:var(--ink);overflow-y:auto;display:none}
#results.on{display:block}
.top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:var(--paper);border-bottom:1px solid rgba(43,17,80,.12);font:12.5px 'IBM Plex Mono',monospace;color:rgba(43,17,80,.6)}
.close{background:transparent;border:1px solid rgba(43,17,80,.3);color:var(--ink);font:12.5px 'IBM Plex Mono',monospace;padding:8px 14px;border-radius:20px}
.close:hover{border-color:var(--chili);background:rgba(255,59,92,.06)}
.receipt{max-width:760px;margin:0 auto;padding:22px 30px 70px;font-family:'IBM Plex Mono',monospace}
.row{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(43,17,80,.55);margin-bottom:2px}
hr{border:none;border-top:1px dashed rgba(43,17,80,.3);margin:16px 0}
.label{font-size:11px;color:rgba(43,17,80,.55);margin-bottom:6px}
.cooked{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(44px,11vw,84px);line-height:.95;margin:6px 0 18px;color:var(--chili)}
.ip-block{margin:14px 0 4px}
.ip{font-size:clamp(26px,6vw,40px);font-weight:600;letter-spacing:.01em;word-break:break-all}
.place{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:34px;line-height:1.05;margin:0 0 6px}
.note{font-family:'Libre Franklin',sans-serif;font-size:13.5px;line-height:1.55;color:rgba(43,17,80,.8);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px}
.scan{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;line-height:1.5;padding:5px 0;border-bottom:1px dotted rgba(43,17,80,.18)}
.scan span:first-child{color:rgba(43,17,80,.55);white-space:nowrap}
.scan span:last-child{text-align:right;word-break:break-word;max-width:70%;font-weight:600}
.fine{margin:26px auto 0;max-width:56ch;font:12px/1.55 'Libre Franklin',sans-serif;color:rgba(43,17,80,.6);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<button id="go" onclick="run()">Show my results</button>

<div id="loading" role="status"><div class="spin"></div><div id="load-msg">Looking things up…</div></div>

<div id="results">
  <div class="top"><span>Your results</span><button class="close" onclick="closeResults()">&times; Close</button></div>
  <div class="receipt">
    <h1 class="cooked">Haha you're cooked</h1>
    <div class="row"><span>RESULTS</span><span id="time"></span></div>
    <hr>
    <div class="label">Table for one, best guess</div>
    <p class="place" id="place">—</p>
    <div class="ip-block" id="ip-row" style="display:none"><div class="label">Your IP address</div><div class="ip" id="ip"></div></div>
    <p class="note" id="note"></p>
    <hr>
    <div class="label">Everything else this tab can see</div>
    <div class="grid" id="scan"></div>
    <p class="fine">HAHA</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- flow ---------- */
async function run(){
  $('go').style.display = 'none';
  $('loading').classList.add('on');
  const [geo] = await Promise.all([locate(), new Promise(r => setTimeout(r, 1200))]);
  $('loading').classList.remove('on');
  show(geo.place, geo.ip);
}
function closeResults(){
  $('results').classList.remove('on');
  document.body.style.overflow = 'hidden';
  const b = $('go'); b.style.display = '';
  b.style.animation = 'none'; b.offsetHeight; b.style.animation = 'pop .7s var(--ease) forwards';
}

/* ---------- IP lookup with fallbacks ---------- */
const providers = [
  {url:'https://ipapi.co/json/', p:d=>({city:d.city, region:d.region, country:d.country_name, ip:d.ip})},
  {url:'https://ipwho.is/', p:d=>({city:d.city, region:d.region, country:d.country, ip:d.ip})},
  {url:'https://get.geojs.io/v1/ip/geo.json', p:d=>({city:d.city, region:d.region, country:d.country, ip:d.ip})},
];
async function locate(){
  for(const pr of providers){
    try{
      const r = await fetch(pr.url); if(!r.ok) continue;
      const {city, region, country, ip} = pr.p(await r.json());
      let place = [city, region].filter(Boolean).join(', ') || country || null;
      if(country && place && !place.includes(country)) place += ' \u00b7 ' + country;
      if(place) return {place, ip: ip || null};
    }catch(e){}
  }
  return {place:null, ip:null};
}

function show(place, ip){
  const now = new Date();
  $('time').textContent = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  $('ip-row').style.display = ip ? 'block' : 'none';
  if(ip) $('ip').textContent = ip;
  $('place').textContent = place || 'Location not found';
  $('note').textContent = place
    ? "That's the location your network address points to. It's usually accurate to the city, not your street."
    : "All three lookup services were blocked or unreachable, usually because of an ad blocker, privacy extension, or a network that strips this kind of request.";
  $('scan').innerHTML = '';
  clientData().forEach(r => addRow('scan', r[0], r[1]));
  asyncRows();
  $('results').classList.add('on'); $('results').scrollTop = 0;
}
function addRow(target, label, value){
  const el = document.createElement('div');
  el.className = 'scan';
  const a = document.createElement('span'), b = document.createElement('span');
  a.textContent = label; b.textContent = value;
  el.append(a, b); $(target).appendChild(el);
}

/* ---------- what the tab can see ---------- */
function parseUA(ua){
  const os = /Windows/.test(ua)?'Windows':/Android/.test(ua)?'Android':/iPhone|iPad|iPod/.test(ua)?'iOS':/Mac OS X/.test(ua)?'macOS':/Linux/.test(ua)?'Linux':'Unknown';
  const browser = /Edg\//.test(ua)?'Edge':/OPR\//.test(ua)?'Opera':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Unknown';
  return {os, browser};
}
function clientData(){
  const n = navigator, s = screen, {os, browser} = parseUA(n.userAgent || '');
  const c = n.connection || n.mozConnection || n.webkitConnection;
  const mq = q => matchMedia(q).matches;
  return [
    ['Timezone', Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown'],
    ['Local time', new Date().toLocaleString()],
    ['Language(s)', (n.languages && n.languages.length ? n.languages.join(', ') : n.language) || 'Unknown'],
    ['Operating system', os],
    ['Browser', browser],
    ['Screen resolution', s.width + '\u00d7' + s.height],
    ['Viewport size', innerWidth + '\u00d7' + innerHeight],
    ['Pixel ratio', String(devicePixelRatio || 1)],
    ['Touch support', n.maxTouchPoints > 0 ? 'Yes (' + n.maxTouchPoints + ' pts)' : 'No'],
    ['CPU cores', n.hardwareConcurrency ? String(n.hardwareConcurrency) : 'Not reported'],
    ['Device memory', n.deviceMemory ? n.deviceMemory + ' GB (approx)' : 'Not reported'],
    ['Connection', c && c.effectiveType ? c.effectiveType.toUpperCase() : 'Not reported'],
    ['Color scheme pref', mq('(prefers-color-scheme: dark)') ? 'Dark' : 'Light'],
    ['Cookies enabled', n.cookieEnabled ? 'Yes' : 'No'],
    ['Referrer', document.referrer || '(direct visit)'],
    ['User agent', n.userAgent || 'Not reported'],
  ];
}
async function asyncRows(){
  try{
    const e = await navigator.storage.estimate();
    addRow('scan', 'Storage quota', ((e.usage||0)/1048576).toFixed(1) + ' MB used of ~' + ((e.quota||0)/1048576).toFixed(0) + ' MB');
  }catch(e){}
  try{
    const d = await navigator.mediaDevices.enumerateDevices(), k = {audioinput:0, audiooutput:0, videoinput:0};
    d.forEach(x => { if(k[x.kind] !== undefined) k[x.kind]++; });
    addRow('scan', 'Media devices', k.videoinput + ' camera, ' + k.audioinput + ' mic, ' + k.audiooutput + ' speaker');
  }catch(e){}
  try{
    const names = ['camera','microphone','geolocation','notifications'];
    const st = await Promise.all(names.map(x => navigator.permissions.query({name:x}).then(r => r.state).catch(() => 'unsupported')));
    addRow('scan', 'Permission states', names.map((x,i) => x + ': ' + st[i]).join(' \u00b7 '));
  }catch(e){}
}
</script>
</body>
</html>
